<title>Guía del Consumidor Formosa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;600;700&display=swap">
<style>
/* Concepto: sitio institucional liviano, blanco y azul del logo de la Subsecretaría; cabecera con logo, contenido en tarjetas simples, pie con CEDETEC en texto */
:root{
  --bg:#FFFFFF; --surface:#F2F7FC; --ink:#0B2545; --muted:#46586F; --line:#D3E1F0;
  --brand:#003B73; --brand-2:#0070AE; --accent:#0070AE; --on-brand:#FFFFFF; --soft:#DCE8F8;
  --ok:#1B7F4B; --ok-bg:#E3F4EA; --bad:#B3261E; --bad-bg:#FBE8E6;
  --font-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --font-body:'Public Sans',Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#071A2E; --surface:#0D2640; --ink:#EAF2FB; --muted:#A5B8CC; --line:#1F3C5C;
  --brand:#0A4C8C; --brand-2:#1478BE; --accent:#7CC0F2; --on-brand:#FFFFFF; --soft:#16406A;
  --ok:#6FD79C; --ok-bg:#12372A; --bad:#FF9A92; --bad-bg:#40191A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071A2E; --surface:#0D2640; --ink:#EAF2FB; --muted:#A5B8CC; --line:#1F3C5C;
  --brand:#0A4C8C; --brand-2:#1478BE; --accent:#7CC0F2; --on-brand:#FFFFFF; --soft:#16406A;
  --ok:#6FD79C; --ok-bg:#12372A; --bad:#FF9A92; --bad-bg:#40191A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.55;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.2px}
h1{font-size:clamp(2.3rem,6vw,3.6rem)} h2{font-size:clamp(1.8rem,4vw,2.4rem)} h3{font-size:1.45rem}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brand-2);outline-offset:3px;border-radius:6px}
header.top{display:flex;align-items:center;gap:14px;padding-block:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header.top img{width:56px;height:55px;border-radius:10px;display:block}
header.top .t{display:flex;flex-direction:column;min-width:0;flex:1}
header.top .t b{font-family:var(--font-display);font-size:1.35rem;line-height:1.1;color:var(--ink)}
header.top .t span{font-size:.85rem;color:var(--muted)}
.crumbs{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:999px;font-size:.9rem;font-weight:600;text-decoration:none}
.chip{text-transform:capitalize}
.chip[aria-current="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
main{padding-block:28px 40px}
.hero{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:var(--on-brand);border-radius:20px;padding:36px clamp(20px,4vw,48px);display:flex;flex-direction:column;gap:14px}
.hero p{max-width:60ch;font-size:1.1rem}
.hero .tag{font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:.8rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:10px;min-width:0}
a.card,button.card{text-decoration:none;color:inherit;text-align:left}
a.card:hover,button.card:hover{border-color:var(--brand-2)}
.card .ic{width:44px;height:44px;border-radius:12px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-family:var(--font-display);font-size:1.5rem;font-weight:700}
.card p{color:var(--muted);font-size:.97rem}
.card .go{margin-top:auto;font-weight:700;color:var(--accent)}
.sec{margin-top:36px;display:flex;flex-direction:column;gap:6px}
.sec>p{color:var(--muted)}
.caplist{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:18px}
.meta{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.done{background:var(--ok-bg);color:var(--ok);border-radius:999px;padding:2px 10px;font-weight:700;font-size:.8rem}
.btn{background:var(--brand);color:var(--on-brand);border:0;border-radius:12px;padding:12px 20px;font-weight:700;display:inline-block;text-decoration:none}
.btn.alt{background:transparent;color:var(--accent);border:2px solid var(--brand-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.video{aspect-ratio:16/9;max-width:100%;border-radius:18px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:var(--on-brand);display:grid;place-items:center;text-align:center;padding:20px;position:relative;overflow:hidden}
.video svg{position:absolute;inset:0;width:100%;height:100%;opacity:.18}
.video .in{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px}
.play{width:68px;height:68px;border-radius:50%;background:#fff;display:grid;place-items:center}
.play i{border-left:22px solid var(--brand);border-top:13px solid transparent;border-bottom:13px solid transparent;margin-left:6px}
.video small{opacity:.9}
.pts{display:grid;gap:12px;margin-top:20px;padding:0;list-style:none}
.pts li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;display:flex;gap:14px;align-items:flex-start}
.pts .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.law{font-size:.9rem;color:var(--muted);margin-top:10px}
.quiz{margin-top:30px;border:2px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand-2);transition:width .3s}
.opts{display:grid;gap:10px}
.opt{background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:12px 16px;text-align:left;font-weight:600}
.opt:hover:not([disabled]){border-color:var(--brand-2)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.fb{border-radius:12px;padding:12px 16px;background:var(--soft);font-size:.97rem}
.scn{display:flex;flex-direction:column;gap:14px}
.story{background:var(--surface);border-left:6px solid var(--brand-2);border-radius:12px;padding:16px 20px}
.checks{display:grid;gap:8px}
.chk{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--bg)}
.chk input{width:22px;height:22px;margin-top:2px;flex:none}
.chk.ok{border-color:var(--ok);background:var(--ok-bg)}
.chk.bad{border-color:var(--bad);background:var(--bad-bg)}
.score{font-family:var(--font-display);font-size:3rem;color:var(--accent);line-height:1}
footer{border-top:1px solid var(--line);padding-block:22px 28px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
footer .by{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
footer .by small{font-size:.8rem;color:var(--muted)}
footer .brand{font-family:var(--font-body);font-weight:800;font-size:1rem;letter-spacing:4px;color:var(--ink)}
.back{display:inline-block;margin-bottom:16px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function runQuiz(c,id,fin){
  var box=document.getElementById('quiz'),i=0,score=0;
  function show(){
    var q=c.quiz[i];
    box.innerHTML='<div class="meta"><b>Cuestionario rápido</b><span>Pregunta '+(i+1)+' de '+c.quiz.length+'</span></div><div class="prog"><i style="width:'+(i/c.quiz.length*100)+'%"></i></div><h3 style="font-family:var(--font-body);font-size:1.15rem;font-weight:700;line-height:1.35">'+q.q+'</h3><div class="opts">'+q.o.map(function(t,n){return '<button class="opt" data-n="'+n+'">'+t+'</button>'}).join('')+'</div><div id="fb" aria-live="polite"></div>';
    box.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){
      var n=+b.dataset.n,ok=n===q.a;if(ok)score++;
      box.querySelectorAll('.opt').forEach(function(x){x.disabled=true;if(+x.dataset.n===q.a)x.classList.add('ok')});
      if(!ok)b.classList.add('bad');
      var last=i===c.quiz.length-1;
      document.getElementById('fb').innerHTML='<div class="fb"><b>'+(ok?'Correcto. ':'No es esa. ')+'</b>'+q.w+'</div><div class="row"><button class="btn" id="nx">'+(last?'Ver resultado':'Siguiente')+'</button></div>';
      document.getElementById('nx').focus();
      document.getElementById('nx').onclick=function(){i++;if(i<c.quiz.length)show();else end()};
    }});
  }
  function end(){
    saveDone(id);
    box.innerHTML='<div class="meta"><b>Resultado</b></div><div class="score">'+score+' / '+c.quiz.length+'</div><p>'+(score===c.quiz.length?'Muy bien: tenés claro este tema.':'Repasá los puntos clave de arriba y volvé a intentarlo cuando quieras.')+'</p><div class="row"><button class="btn alt" id="rt">Repetir cuestionario</button></div>';
    document.getElementById('rt').onclick=function(){i=0;score=0;show()};
    fin(score);
  }
  show();
}

    if(i>=STEPS.length)return acta();
    var s=STEPS[i];
    app.innerHTML=head()+'<div class="scn" style="margin-top:16px">'+(i===0?'<div class="story"><b>La situación.</b> Sos inspector municipal y tu municipio tiene convenio con la Subsecretaría. Hoy inspeccionás el almacén “El Sol”. [Caso de ejemplo para práctica]</div>':'')+'<span class="tag" style="color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:.8rem">'+s.k+'</span><h2 style="font-size:1.6rem">'+s.q+'</h2><div class="opts" id="o">'+s.o.map(function(t,n){return '<button class="opt" data-n="'+n+'">'+t+'</button>'}).join('')+'</div><div id="fb" aria-live="polite"></div></div>';
    var tries=0;
    app.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){
      var n=+b.dataset.n,ok=n===s.a;
      if(ok){if(tries===0)score++;app.querySelectorAll('.opt').forEach(function(x){x.disabled=true;if(+x.dataset.n===s.a)x.classList.add('ok')});
        document.getElementById('fb').innerHTML='<div class="fb"><b>Correcto. </b>'+s.w+'</div><div class="row"><button class="btn" id="nx">Continuar</button></div>';
        document.getElementById('nx').focus();document.getElementById('nx').onclick=function(){i++;step();window.scrollTo(0,0)};
      }else{tries++;b.disabled=true;b.classList.add('bad');document.getElementById('fb').innerHTML='<div class="fb">Esa no es la mejor opción. Probá con otra.</div>'}
    }});
  }
  function acta(){
    app.innerHTML=head()+'<div class="scn" style="margin-top:16px"><span class="tag" style="color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:.8rem">Armá el acta</span><h2 style="font-size:1.6rem">Marcá los 9 datos que el acta debe contener</h2><p style="color:var(--muted)">Hay 12 opciones. Tres no corresponden.</p><div class="checks" id="ch">'+ACTA.map(function(a,n){return '<label class="chk"><input type="checkbox" data-n="'+n+'"><span>'+a[0]+'</span></label>'}).join('')+'</div><div class="row"><button class="btn" id="vf">Verificar</button></div><div id="fb" aria-live="polite"></div></div>';
    document.getElementById('vf').onclick=function(){
      var good=0,wrong=0;
      app.querySelectorAll('.chk').forEach(function(l){var inp=l.querySelector('input'),r=ACTA[+inp.dataset.n][1];inp.disabled=true;
        if(r&&inp.checked){good++;l.classList.add('ok')}else if(!r&&inp.checked){wrong++;l.classList.add('bad')}else if(r&&!inp.checked){l.classList.add('bad')}});
      document.getElementById('vf').disabled=true;
      if(good===9&&wrong===0)score++;
      document.getElementById('fb').innerHTML='<div class="fb"><b>Marcaste '+good+' de 9 datos correctos'+(wrong?' y '+wrong+' que no corresponden':'')+'.</b> Los datos faltantes quedaron resaltados en rojo. La opinión sobre las intenciones, el monto de la multa y los antecedentes personales no van en el acta: se describen hechos y la sanción la decide la autoridad provincial.</div><div class="row"><button class="btn" id="fin">Ver resultado</button></div>';
      document.getElementById('fin').onclick=function(){i=total;fin()};
    };
  }
  function fin(){
    app.innerHTML='<a class="back" href="#municipio">← Municipio</a><h2>Caso terminado</h2><div class="card" style="margin-top:18px"><div class="score">'+score+' / '+total+'</div><p>Pasos resueltos a la primera. '+(score>=total-1?'Muy buen trabajo: tu inspección sería sólida.':'Repasá las cápsulas de redacción del acta y las reglas de oro, y volvé a probar.')+'</p></div><div class="row"><button class="btn" id="rs">Repetir el caso</button><a class="btn alt" href="#cap-reglas">Ver las siete reglas de oro</a></div>';
    document.getElementById('rs').onclick=function(){i=0;score=0;step()};
  }
  step();
}
function route(){
  var h=(location.hash||'#inicio').slice(1);
  nav.innerHTML=navHtml(h in PROF?h:(h==='escenario'?'municipio':(h==='inicio'?h:curProf)));
  if(h in PROF)profile(h);else if(h==='escenario')scenario();else if(h.indexOf('cap-')===0)capsule(h.slice(4));else home();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);route();
</script>
